<style>

:root{--bg:#F4F4F8;--fg:#0A0A0F;--mute:#5A5A70;--card:#fff;--line:#E0E0E8;--tt:#006E55;--teal:#00C49A;--ink:#0A0A0F;--night:#161620;--slate:#1A1A2A;--mist:#A0A0C0;--accent:#7B68EE;--signal:#FF6B35;
--sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0A0F;--fg:#F4F4F8;--mute:#A0A0C0;--card:#161620;--line:#26263A;--tt:#00C49A}}
:root[data-theme="dark"]{--bg:#0A0A0F;--fg:#F4F4F8;--mute:#A0A0C0;--card:#161620;--line:#26263A;--tt:#00C49A}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
.w{max-width:1040px;margin:0 auto;padding:0 22px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .w{display:flex;align-items:center;gap:18px;height:54px;overflow-x:auto}
nav b{font-weight:600;letter-spacing:-.5px;font-size:18px;white-space:nowrap}nav b i{font-style:normal;color:var(--tt)}
nav a{color:var(--mute);text-decoration:none;font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
nav a:hover{color:var(--tt)}
button{font:inherit;cursor:pointer}
#th{margin-left:auto;background:none;border:1px solid var(--line);color:var(--fg);border-radius:99px;padding:4px 12px;font:500 12px var(--mono)}
.hero{background:var(--ink);color:#F4F4F8;text-align:center;padding:72px 0 56px}
.hero img.lg{width:min(520px,86%);height:auto;display:block;margin:0 auto}
.hero p{font:500 12px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--mist);margin:26px 0 0}
.hero h1{font-size:clamp(30px,6vw,52px);font-weight:500;letter-spacing:-1.5px;line-height:1.1;margin:18px 0 0}
.hero h1 span{color:var(--teal)}
section{padding:64px 0 8px}
.k{font:500 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--tt);margin:0 0 8px}
h2{font-size:clamp(24px,4vw,34px);font-weight:500;letter-spacing:-1px;margin:0 0 10px}
.lead{color:var(--mute);max-width:640px;margin:0 0 28px}
.g{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card .cap{padding:12px 16px;font-size:13px;color:var(--mute)}.card .cap b{color:var(--fg);font-weight:500;display:block}
.card img{display:block;width:100%;height:auto}
.rules{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:16px}
.rule{border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;background:var(--card)}
.rule h4{margin:0 0 4px;font-size:14px;font-weight:600}.rule.ok h4{color:var(--tt)}.rule.no h4{color:var(--signal)}
.sw{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.s{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);text-align:left;padding:0;color:var(--fg)}
.s i{display:block;height:84px}.s span{display:block;padding:9px 12px 0;font-weight:500;font-size:14px}
.s code{display:block;padding:0 12px 4px;font:12px var(--mono);color:var(--mute)}.s small{display:block;padding:0 12px 10px;font-size:11px;color:var(--mute)}
.scale{display:flex;border-radius:12px;overflow:hidden;margin-top:16px;border:1px solid var(--line)}
.scale button{flex:1;border:0;height:64px;font:11px var(--mono);padding:0}
.type{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:24px}
.type .row{padding:16px 0;border-top:1px solid var(--line)}.type .row:first-child{border:0;padding-top:0}
.type small{display:block;font:12px var(--mono);color:var(--mute);margin-top:4px}
.btns{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.b{border-radius:10px;padding:11px 20px;font-weight:500;font-size:14px;border:1px solid transparent;font-family:var(--sans)}
.b1{background:var(--teal);color:#003D30}.b2{background:transparent;color:var(--tt);border-color:var(--teal)}.b3{background:none;color:var(--mute)}
.badge{background:#CCFAEF;color:#006E55;font-weight:500;font-size:12px;padding:5px 12px;border-radius:99px}
.app{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.id{background:var(--ink);color:#F4F4F8;border-radius:14px;padding:26px;display:flex;flex-direction:column;gap:14px;justify-content:space-between;min-height:190px}
.id img{width:60px;border-radius:10px}.id h3{margin:0;font-weight:500;font-size:22px;letter-spacing:-.5px}.id p{margin:0;color:var(--mist);font:12px var(--mono)}
.id.l{background:#E8E8F0;color:#0A0A0F}.id.l p{color:#5A5A70}
.tone li{margin:6px 0}.tone ul{padding-left:18px;margin:0;color:var(--mute)}.tone b{color:var(--fg);font-weight:500}
footer{margin-top:72px;background:var(--ink);color:var(--mist);padding:34px 0;font:12px var(--mono);letter-spacing:.06em}
footer .w{display:flex;flex-wrap:wrap;gap:10px 28px;justify-content:space-between}footer a{color:var(--teal);text-decoration:none}
#t{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--teal);border:1px solid var(--teal);font:12px var(--mono);padding:8px 16px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none}
#t.on{opacity:1;transform:translate(-50%,0)}

.hero .lead{color:#A0A0C0;margin:16px auto 26px;max-width:660px}.hero .row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.hero img.ic{width:110px;height:auto;margin:0 auto 6px;display:block;border-radius:16px}
a.b{text-decoration:none;display:inline-block}.hero .b3{color:#A0A0C0;border-color:#26263A}
#rot{min-height:2.3em;transition:opacity .5s}#rot.off{opacity:0}#rot small{display:block;font-size:.4em;font-weight:400;letter-spacing:0;color:#A0A0C0;margin-top:12px}
.hero h1.s{font-size:clamp(28px,5vw,44px)}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}.stat b{display:block;font-size:24px;font-weight:500;letter-spacing:-1px;color:var(--tt)}.stat span{font-size:13px;color:var(--mute)}
.rule ul{padding-left:18px;margin:8px 0 0;color:var(--mute)}.rule li{margin:4px 0}.rule p{margin:0;color:var(--mute)}.rule .w6{font:500 11px var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--tt);margin-bottom:6px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}.tbl{width:100%;min-width:560px;border-collapse:collapse;font-size:14px}.tbl th,.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.tbl th{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tt)}.tbl td:first-child{font-weight:500;white-space:nowrap}
.story{border-left:3px solid var(--teal);padding:2px 0 2px 20px;max-width:680px}.story p{margin:0 0 14px}
.q{font-size:clamp(20px,3.4vw,28px);font-weight:500;letter-spacing:-.6px;line-height:1.3;max-width:760px;margin:0 0 14px}.q em{font-style:normal;color:var(--tt)}
.band{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-top:56px}.band b{font-weight:500;font-size:18px;display:block}.band span{color:var(--mute);font-size:14px}

section.p{padding-top:44px}footer a{margin-right:4px}

.links{display:flex;align-items:center;gap:18px}
#hb{display:none;background:none;border:1px solid var(--line);color:var(--fg);border-radius:10px;width:40px;height:34px;padding:0;font-size:18px;line-height:1}
body{overflow-wrap:break-word}
@media(max-width:760px){
.w{padding:0 18px}
nav .w{gap:10px}
#hb{display:block}
.links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;gap:0;background:var(--bg);border-bottom:1px solid var(--line);padding:4px 18px 16px;box-shadow:0 14px 24px rgba(0,0,0,.18)}
nav.open .links{display:flex}
.links a{padding:15px 2px;border-bottom:1px solid var(--line);font-size:13px}
.links a.pill{margin-top:14px;text-align:center;border-radius:10px;padding:13px;border:1px solid var(--teal)}
.hero{padding:44px 0 36px}
.hero img.ic{width:84px}
.hero p{letter-spacing:.14em}
.hero .row{flex-direction:column;align-items:stretch}
.hero .b{text-align:center;width:100%}
#rot{min-height:5.2em}
section{padding:44px 0 4px}section.p{padding-top:32px}
.stats{grid-template-columns:repeat(2,1fr)}.stat b{font-size:20px}
.tbl{min-width:480px}.tbl td:first-child{white-space:normal}
.band{padding:20px;margin-top:40px}.band>a.b{width:100%;text-align:center}
.story{padding-left:14px}
footer{margin-top:48px}footer .w{flex-direction:column;gap:12px}
}

"about":function(){return hero('<h1 class="s">Show That You Can,<br><span>Don’t Ask.</span></h1>','Real Work. Real Experience. Real Connection.','','Our core value')+'<main class="w"><section class="p"><p class="k">Why we exist</p><p class="q">The world keeps asking people to prove they’re worth a chance before giving them the chance to prove it. We flip that. At Teambl, you don’t wait for permission — you show what you can do, and <em>the proof does the asking for you.</em></p></section><section class="p"><p class="k">The story behind Teambl</p><h2>An empty CV, and one person who took a chance</h2><div class="story"><p>I walked into an interview with a half-page CV.</p><p>My name. My degree. And nothing else.</p><p>I’d just finished school and had never worked a single day. What else was I going to put on it, anyway?</p><p>The woman screening candidates looked at my CV, looked at me, and paused.</p><p>It was a long pause. Long enough that I knew she knew.</p><p>There was nothing on that page to interview me on.</p><p>I was ready to go home.</p><p>Then she asked, “You just finished school and have never worked anywhere?”</p><p>I said yes.</p><p>She didn’t ask another question.</p><p>One week later, I got the job. Eight months later, I landed an even better one.</p><p>I still don’t fully know why she took that chance on me. I think about it more than almost anything else from those years.</p><p>And I’m glad something was born from that experience.</p><p>Not everyone gets a stranger willing to look past an empty CV. That’s why we’re trying to build the system behind Teambl to do exactly that — on purpose, for thousands of people, instead of by luck, for one.</p><p><b>Mapida Wreford</b><br><span style="color:var(--mute)">Founder, Teambl</span></p></div><div class="row" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:20px">'+btn("Connect with Mapida on LinkedIn",LI,"b1",1)+btn("Follow Teambl on LinkedIn",LC,"b2",1)+'</div></section>'+band()+'</main>'}};
